<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Protótipo</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 30px auto; }
    div { border: 1px solid #777; padding: 15px; margin: 10px 0; }
    .cards { display: flex; gap: 10px; }
    .cards span { border: 1px solid #aaa; padding: 25px; flex: 1; }
  </style>
</head>
<body>
  <h1>Protótipo - Ponto do Lanche</h1>

  <div>
    <b>Cabeçalho</b><br>
    Nome da lanchonete<br>
    Início | Cardápio | Pedido
  </div>

  <div>
    <b>Início</b><br>
    Texto de boas-vindas + botão de mudar cor
  </div>

  <div>
    <b>Cardápio</b>
    <p>Filtro de categoria</p>
    <div class="cards">
      <span>Produto 1</span>
      <span>Produto 2</span>
      <span>Produto 3</span>
    </div>
  </div>

  <div>
    <b>Pedido</b><br>
    Lista dos produtos + total + formulário
  </div>

  <div><b>Rodapé</b></div>
</body>
</html>
